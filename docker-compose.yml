# ============================================================
# docker-compose.yml — Sistema completo de Agentes Conversacionales
#
# Uso:
#   1. Copia .env.example → .env y rellena las API keys
#   2. docker compose up --build
#   3. API:       http://localhost:8000/docs
#      Streamlit: http://localhost:8501
#
# Para detener: docker compose down
# Para reconstruir: docker compose up --build --force-recreate
# ============================================================

services:

  # ----------------------------------------------------------
  # Backend — FastAPI (4 microservicios de análisis + scraping)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agentes-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # El dataset .parquet y la base de datos de twscrape persisten
      - ./data:/app/data:ro
      - twscrape_db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Frontend — Streamlit (chat UI + dashboard visual)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: agentes-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # El frontend llama a la API por nombre de servicio interno
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  twscrape_db:
    driver: local
